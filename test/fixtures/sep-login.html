<!-- Public SEP login form structure; values are empty and no session is included. -->
<form action="/slogin" id="sepform" name="sepform" method="post">
 <input type="hidden" id="userName" name="userName">
 <input type="hidden" id="pwd" name="pwd">
 <input type="hidden" id="loginFrom" name="loginFrom" value="">
 <input type="hidden" id="sb" name="sb" value="sb">
</form>
<form>
 <label for="userName1">用户名</label>
 <input type="text" onkeydown="enterSumbit(event)" class="form-control" id="userName1" name="userName1" value="" placeholder="请输入您的用户名">
 <label for="pwd1">密码</label>
 <input type="password" onkeydown="enterSumbit(event)" class="form-control" id="pwd1" name="pwd1" placeholder="请输入您的密码">
 <button type="button" id="sb1" name="sb1" value="sb1" onclick="return sepSubmit();" class="btn signin_btn signin_btn_two" data-toggle="modal" data-target=".signin_modal">登录</button>
</form>
