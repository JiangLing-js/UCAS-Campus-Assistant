<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>校园桥接</title></head><body><h1>国科大 · 校园桥接</h1><p>同步校园信息，一键登录 SEP 和邮箱。版本 0.4.0</p><form id="pair"><label>本地工作台<input id="server" value="http://127.0.0.1:3210" required></label><label>连接码<input id="token" type="password" autocomplete="off" required placeholder="从工作台「连接与设置」复制"></label><label class="check"><input id="auto" type="checkbox">每 15 分钟同步已打开的校园页面</label><label class="check"><input id="reminders" type="checkbox">工作台关闭后也提醒</label><small>需要 Chrome 和本地服务运行，每分钟检查一次。首次启用会请求通知权限。</small><button id="save">保存连接并同步</button></form><p id="status" role="status"></p><p id="reminder-status" role="status"></p><small>账号和密码只在本机保存。同步不读取密码或 Cookie，不报名、不选课。</small><script src="popup.js"></script></body></html>
