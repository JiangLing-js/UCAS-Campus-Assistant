<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>校园桥接</title></head><body><h1>国科大 · 校园桥接</h1><p>把已打开的课表、通知和讲座同步到本机。也可在工作台一键登录 SEP 或邮箱。</p><form id="pair"><label>本地工作台<input id="server" value="http://127.0.0.1:3210" required></label><label>连接码<input id="token" type="password" autocomplete="off" required placeholder="从工作台「连接与设置」复制"></label><label class="check"><input id="auto" type="checkbox">每 15 分钟同步已打开的校园页面</label><button id="save">连接并同步</button></form><p id="status" role="status"></p><small>同步不读取密码或 Cookie。一键登录仅在工作台点击后填写保存的凭据，不报名、不选课。</small><script src="popup.js"></script></body></html>
